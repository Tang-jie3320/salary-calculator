<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发光文字上浮效果</title>
<style>
    /* 1. 基础页面设置与暗紫色背景 */
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* 隐藏滚动条 */
        background: linear-gradient(to bottom, #1a0b2e, #2d1b4e); /* 模拟原图的暗紫渐变背景 */
        font-family: 'Microsoft YaHei', sans-serif;
    }

    #container {
        position: relative;
        width: 100%;
        height: 100%;
    }

    /* 2. 漂浮元素的共有样式 */
    .floating-item {
        position: absolute;
        bottom: -100px; /* 初始位置在屏幕最下方不可见处 */
        color: rgba(255, 255, 255, 0.9);
        /* 核心：利用 text-shadow 制作发光效果 */
        text-shadow: 0 0 10px rgba(216, 150, 255, 0.8), 0 0 20px rgba(216, 150, 255, 0.5);
        white-space: nowrap;
        user-select: none;
        pointer-events: none; /* 防止鼠标交互干扰 */
        animation-name: floatUp;
        animation-timing-function: linear; /* 匀速向上漂浮 */
        animation-fill-mode: forwards;
    }

    /* 3. 上浮动画关键帧 */
    @keyframes floatUp {
        0% {
            transform: translateY(0);
        }
        100% {
            transform: translateY(-120vh); /* 移动到屏幕最上方以外 */
        }
    }
</style>
</head>
<body>

<div id="container"></div>

<script>
    const container = document.getElementById('container');

    // 根据你的截图提取的文案素材库
    const words = [
        "我是郝青", "我是郝青", "我是郝青", 
        "我是郝青", "我是郝青", "我是郝青", 
        "我是郝青", "我是郝青", "❤"
    ];

    function createFloatingItem() {
        const el = document.createElement('div');
        el.classList.add('floating-item');

        // 1. 随机选取文案
        const text = words[Math.floor(Math.random() * words.length)];
        el.innerText = text;

        // 2. 随机生成各项属性，制造参差不齐的动态美感
        const leftPos = Math.random() * 90; // X轴位置 (0% - 90%)
        const fontSize = Math.random() * 40 + 16; // 字体大小 (16px - 56px)
        const duration = Math.random() * 6 + 12; // 上浮耗时/速度 (6秒 - 12秒)
        const opacity = Math.random() * 0.6 + 0.3; // 透明度 (0.3 - 0.9)
        const blur = Math.random() * 4; // 模糊度 (0px - 4px)，制造远近景深效果

        // 3. 将随机属性应用到元素上
        el.style.left = `${leftPos}%`;
        el.style.fontSize = `${fontSize}px`;
        el.style.animationDuration = `${duration}s`;
        el.style.opacity = opacity;
        el.style.filter = `blur(${blur}px)`;

        // 特殊处理：如果是爱心，给它换个偏红/粉的发光颜色
        if (text === "❤") {
            el.style.color = "rgba(255, 105, 180, 0.8)";
            el.style.textShadow = "0 0 15px rgba(255, 20, 147, 0.8)";
            // 让爱心稍微大一点
            el.style.fontSize = `${fontSize * 1.5}px`; 
        }

        container.appendChild(el);

        // 4. 性能优化：当元素动画结束（漂出屏幕外）时，将其从 DOM 中彻底移除
        el.addEventListener('animationend', () => {
            el.remove();
        });
    }

    // 5. 设置定时器，不断生成新词（每 300 毫秒生成一个）
    setInterval(createFloatingItem, 300);

    // 页面加载时先立刻生成一批，避免一开始屏幕太空
    for(let i=0; i<15; i++) {
        setTimeout(createFloatingItem, i * 100);
    }
</script>

</body>
</html>
