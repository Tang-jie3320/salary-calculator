<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>抽奖系统</title>
<style>
  body {
    text-align: center;
    font-family: Arial;
    background: #f5f5f5;
  }

  .container {
    position: relative;
    width: 300px;
    margin: 50px auto;
  }

  /* 转盘 */
  .wheel {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border: 8px solid #333;
    position: relative;
    overflow: hidden;
  }

  .sector {
    position: absolute;
    width: 50%;
    height: 50%;
    transform-origin: 100% 100%;
    text-align: center;
    line-height: 150px;
    font-weight: bold;
    background: #ffcc00;
  }

  .sector:nth-child(2) { transform: rotate(60deg); background:#ff9999;}
  .sector:nth-child(3) { transform: rotate(120deg); background:#99ccff;}
  .sector:nth-child(4) { transform: rotate(180deg); background:#66ff99;}
  .sector:nth-child(5) { transform: rotate(240deg); background:#ffcc99;}
  .sector:nth-child(6) { transform: rotate(300deg); background:#cc99ff;}

  /* 🎯 指针 */
  .pointer {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 140px;
    background: red;
    transform-origin: bottom center;
    transform: translate(-50%, -100%) rotate(0deg);
    transition: transform 4s ease-out;
    border-radius: 3px;
  }

  /* 中心点 */
  .center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    background: black;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
  }

  button {
    padding: 10px 30px;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>🎁 最漂亮的小兮专属抽奖</h1>

<div class="container">
  <div class="wheel">
    <div class="sector">10元</div>
    <div class="sector">20元</div>
    <div class="sector">谢谢参与</div>
    <div class="sector">5元</div>
    <div class="sector">20元</div>
    <div class="sector">再来一次</div>
  </div>

  <div class="pointer" id="pointer"></div>
  <div class="center"></div>
</div>

<button onclick="startLottery()">开始抽奖</button>

<h2 id="result"></h2>

<script>
  let rotating = false;

  function startLottery() {
    if (rotating) return;
    rotating = true;

    const pointer = document.getElementById('pointer');

    // 🎯 固定指向：第2块（20元）
    const targetIndex = 2.5;

    const degPerItem = 360 / 6;

    // 指针最终角度
    const targetDeg = targetIndex * degPerItem + degPerItem / 2;

    // 多转几圈再停下
    const rotateDeg = 360 * 5 + targetDeg;

    pointer.style.transform =
      `translate(-50%, -100%) rotate(${rotateDeg}deg)`;

    setTimeout(() => {
      document.getElementById('result').innerText = "恭喜最最最可爱迷人漂亮的小兮中了 20 元！🎉，请找最喜欢的人领取！！！";
      rotating = false;
    }, 4000);
  }
</script>

</body>
</html>
